name: SmallTV SDC2 USB port
on:
  workflow_dispatch:
  push:
    branches: [sdc2-build]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pin build core constraints
        run: |
          printf 'platformio==6.1.19\npioarduino==6.1.19\n' > "$RUNNER_TEMP/pio-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/pio-constraints.txt" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: pio-cache
        with:
          path: ~/.platformio
          key: sdc2-compact-${{ runner.os }}-${{ hashFiles('platformio.sdc2.ini') }}
          restore-keys: |
            sdc2-compact-${{ runner.os }}-
      - name: Install core and test packaging bounds
        run: |
          pip install platformio==6.1.19
          python tools/check_sdc2_port.py
          python tools/test_sdc2_usb_package.py
      - name: Build SmallTV application for SDC2
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          pio run -e smalltv_sdc2_usb 2>&1 | tee build-logs/firmware-build.log
      - name: Validate themes with SmallTV engine and build LittleFS
        run: |
          python tools/make_sdc2_themes.py
          pio run -e smalltv_sdc2_usb -t buildfs
      - name: Package USB installation and new-layout OTA image
        run: |
          python tools/package_sdc2_usb.py .pio/build/smalltv_sdc2_usb dist-sdc2
          cp SDC2-USB.md dist-sdc2/README.md
          cp tools/flash_sdc2_usb.py dist-sdc2/
          cp -r sdc2-themes dist-sdc2/
      - uses: actions/cache/save@v6
        if: success() && steps.pio-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.platformio
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        with:
          name: SmallTV-SDC2-USB
          path: dist-sdc2/
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: SmallTV-SDC2-diagnostics
          path: build-logs/
