<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmallTV · SDC2</title><style>
*{box-sizing:border-box}body{max-width:640px;margin:auto;padding:20px;background:#080d18;color:#f4f7ff;font:15px system-ui}section{background:#152033;padding:20px;border-radius:16px;margin:16px 0}h1{font-size:25px}h2{font-size:18px}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #40526b;border-radius:8px;background:#080d18;color:#f4f7ff;width:100%}input[type=color]{height:44px}button{background:#65dbce;color:#080d18;font-weight:bold;margin-top:15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}small,#status{color:#adb8cb}canvas{display:block;margin:18px auto;border:1px solid #40526b;border-radius:12px}#msg{position:sticky;bottom:15px;background:#65dbce;color:#080d18;padding:12px;border-radius:10px;display:none}
</style><h1>SmallTV · SDC2</h1><p id="status">기기에 연결 중…</p>
<section><h2>시계·날씨 화면</h2><label>배치</label><select id="layout"><option value="0">클래식</option><option value="1">날씨 카드</option><option value="2">미니멀</option></select>
<div class="grid"><div><label>배경</label><input id="bg" type="color"></div><div><label>시계</label><input id="fg" type="color"></div><div><label>강조</label><input id="accent" type="color"></div></div>
<div class="grid"><div><label>초</label><select id="seconds"><option value="true">표시</option><option value="false">숨김</option></select></div><div><label>날짜</label><select id="date"><option value="true">표시</option><option value="false">숨김</option></select></div><div><label>날씨</label><select id="weather"><option value="true">표시</option><option value="false">숨김</option></select></div></div>
<label>시계 세로 위치</label><input id="offset" type="range" min="-16" max="16"><label>밝기</label><input id="brightness" type="range" min="0" max="100">
<div class="grid"><div><label>시간</label><select id="h24"><option value="true">24시간</option><option value="false">12시간</option></select></div><div><label>180° 회전</label><select id="rotate"><option value="false">끔</option><option value="true">켬</option></select></div><div><label>패널 반전</label><select id="invert"><option value="true">켬 (기본)</option><option value="false">끔</option></select></div></div>
<canvas id="preview" width="240" height="240"></canvas><small>배치 미리보기: 예시 시간·날씨이며 실제 SmallTV 글꼴과 다를 수 있습니다.</small>
<label>시간대 (POSIX)</label><input id="timezone" value="KST-9"><small>한국: KST-9</small>
<div class="grid"><div><label>날씨 위도</label><input id="lat" type="number" step="0.0001" min="-90" max="90"></div><div><label>날씨 경도</label><input id="lon" type="number" step="0.0001" min="-180" max="180"></div></div>
<button id="save">저장하고 적용</button></section>
<section><h2>Wi-Fi</h2><label>2.4GHz 네트워크 이름</label><input id="ssid" autocomplete="off" maxlength="32"><label>비밀번호</label><input id="pass" type="password" maxlength="64" autocomplete="new-password"><button id="wifi">Wi-Fi 연결</button><small>연결 실패 시 설정용 Wi-Fi가 다시 열립니다. 시계 화면의 이름과 주소를 확인하세요.</small></section>
<section><h2>펌웨어 업데이트</h2><input id="file" type="file" accept=".bin"><button id="upload">OTA .bin 업로드</button><p><small>SDC2용 앱 전용 .bin을 선택하세요. factory 파일은 사용할 수 없습니다.</small></p></section>
<p><small>smalltv-mod 원본 ThemeEngine.cpp · SDC2 네이티브 포트</small></p><div id="msg"></div>
<script>
const $=id=>document.getElementById(id),numeric=['layout','offset','brightness','lat','lon'],boolean=['seconds','date','weather','h24','rotate','invert'],colors=['bg','fg','accent'];let first=true;
function toast(t){$('msg').textContent=t;$('msg').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('msg').style.display='none',6000)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()}
function preview(){const c=$('preview').getContext('2d'),layout=+$('layout').value,y=([92,75,110][layout]||92)+(+$('offset').value);c.fillStyle=$('bg').value;c.fillRect(0,0,240,240);c.textAlign='center';function t(v,y,size,color){c.fillStyle=color;c.font=size+'px monospace';c.fillText(v,120,y+size*.35)}if($('date').value==='true')t('SUN 22 NOV',24,16,$('fg').value);t('12:34',y,56,$('fg').value);if($('seconds').value==='true')t('56',y+46,16,$('accent').value);if($('weather').value==='true'){t('23 C',184,24,$('accent').value);t('Humidity 45%',218,12,$('fg').value)}}
async function load(){try{const s=await(await fetch('/api/state')).json();$('status').textContent=s.version+' · '+(s.connected?s.ip:'설정 Wi-Fi: '+s.ap)+(s.weather_error?' · '+s.weather_error:'');if(first){for(const k in s.cfg){if($(k))$(k).value=String(s.cfg[k])}first=false;preview()}}catch(e){$('status').textContent='기기에 연결할 수 없습니다'}}
for(const id of [...numeric,...boolean,...colors])$(id).addEventListener('input',preview);
$('save').onclick=async()=>{try{let d={timezone:$('timezone').value};for(const k of numeric)d[k]=+$(k).value;for(const k of boolean)d[k]=$(k).value==='true';for(const k of colors)d[k]=$(k).value;await post('/api/settings',d);toast('저장하고 적용했습니다')}catch(e){toast(e.message)}};
$('wifi').onclick=async()=>{try{await post('/api/wifi',{ssid:$('ssid').value,pass:$('pass').value});$('pass').value='';toast('연결 중입니다. 시계와 Wi-Fi 주소를 확인하세요.')}catch(e){toast(e.message)}};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return toast('.bin을 선택하세요');if(f.size>786432)return toast('OTA 슬롯 용량을 초과합니다');$('upload').disabled=true;try{const r=await fetch('/ota',{method:'POST',body:f});if(!r.ok)throw Error(await r.text());toast('업데이트 완료. 재부팅합니다.')}catch(e){toast(e.message)}finally{$('upload').disabled=false}};
load();setInterval(load,10000);
</script></html>
