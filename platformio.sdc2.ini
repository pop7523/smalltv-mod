; Use: python -m platformio run -c platformio.sdc2.ini -e smalltv_sdc2
; Experimental build candidate only. Upload is deliberately unavailable.
[platformio]
extra_configs = platformio.ini
default_envs = smalltv_sdc2

[env:smalltv_sdc2]
extends = env:smalltv_c2
board_build.partitions = partitions/sdc2_stock.csv
board_upload.maximum_size = 786432
board_build.flash_mode = dio
board_build.f_flash = 60000000L
; Restate flags to drop WireGuard; do not inherit SMALLTV_WIREGUARD=1.
build_flags =
    -D SMALLTV_ESP32C2
    -D SMALLTV_SDC2
    -D FW_NO_GITHUB_UPDATE
    -D FW_VERSION_SUFFIX=\"-sdc2-experimental\"
    -D ARDUINOJSON_USE_DOUBLE=0
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CORE_DEBUG_LEVEL=0
    -fno-exceptions
    -fno-asynchronous-unwind-tables
    -fno-unwind-tables
lib_deps = ${common.lib_deps}
custom_sdkconfig =
    CONFIG_BT_ENABLED=n
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
    CONFIG_XTAL_FREQ_26=y
    CONFIG_LWIP_NETIF_LOOPBACK=y
extra_scripts = post:tools/sdc2_size_guard.py
upload_protocol = custom
upload_command = python tools/refuse_sdc2_upload.py

; Same application features; rebuild IDF using the working SDC2 reference's
; ROM crypto and size-oriented settings. This still needs a real size check.
[env:smalltv_sdc2_compact]
extends = env:smalltv_sdc2
custom_sdkconfig =
    ${env:smalltv_sdc2.custom_sdkconfig}
    CONFIG_ESP32C2_REV_MIN_1=y
    CONFIG_ESP32C2_REV_MAX_FULL=299
    CONFIG_ESPTOOLPY_FLASHFREQ_60M=y
    CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
    CONFIG_COMPILER_OPTIMIZATION_SIZE=y
    CONFIG_MBEDTLS_USE_CRYPTO_ROM_IMPL=y
    CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
    CONFIG_LOG_DEFAULT_LEVEL_NONE=y
    CONFIG_LOG_DYNAMIC_LEVEL_CONTROL=n
    CONFIG_ESP_SYSTEM_PANIC_SILENT_REBOOT=y
    CONFIG_ESP_CONSOLE_NONE=y
